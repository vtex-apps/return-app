name: Release and Publish

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/push-test.txt"
  workflow_dispatch:
    inputs:
      jira_id:
        description: 'https://officedepot.atlassian.net/browse/ELOR-2367'
        required: false
        type: string
      release_type:
        description: 'Release type (major/minor/patch). If provided, skips semantic-release analysis.'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    uses: odp-ecom/io-reusable-workflow/.github/workflows/release.yml@main
    secrets: inherit
    with:
      jira_id: ${{ inputs.jira_id }}
      release_type: ${{ inputs.release_type }}
    